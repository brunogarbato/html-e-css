<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container {
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
        }

        .caixa1 {
            grid-row: 1 / 2;
            grid-column: 1 / -1;
            background-color: lightcoral;  
            text-align: center;
        }
        .caixa2 {
            grid-row: 2 / -1;
            grid-column: 1 / 3;
            background-color: lightblue;
            text-align: center;
            
        }

        .caixa3 {
            grid-row: 2 / -1;
            grid-column: 3 / -1;    
            background-color: aqua;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">A</div>
        <div class="caixa2">B</div>
        <div class="caixa3">C</div>
    </div>
</body>
</html>
